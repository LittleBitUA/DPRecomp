name = "DPCameraMouseHookWalk"
registers = ["r31"]

[[midasm_hook]]
address = 0x8233A2D4          # sub_8233A150 (fmadds)
name = "DPCameraMouseHook"
registers = ["r31"]

# DP1 v1.1 (#11): capture the camera anchor pointer for the direct yaw write
